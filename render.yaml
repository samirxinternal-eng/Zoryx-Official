# ==========================================
# Zoryx Telegram Mini App
# render.yaml
# ==========================================

services:

  - type: web

    name: zoryx-server

    runtime: node

    plan: free

    buildCommand: npm install

    startCommand: npm start

    autoDeploy: true

    envVars:

      - key: NODE_ENV
        value: production

      - key: NODE_VERSION
        value: "20"

      - key: PORT
        value: "10000"

      - key: BOT_TOKEN
        sync: false

      - key: BOT_USERNAME
        sync: false

      - key: MONGODB_URI
        sync: false

      - key: DB_NAME
        value: zoryx

      - key: DEFAULT_ENERGY
        value: "1000"

      - key: MAX_ENERGY
        value: "1000"

      - key: ENERGY_RESTORE_TIME
        value: "4000"

      - key: DAILY_RESET_HOUR
        value: "5"

      - key: DAILY_RESET_MINUTE
        value: "0"

      - key: TIMEZONE
        value: "GMT"

      - key: WEB_CONCURRENCY
        value: "1"
