<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

    <meta name="theme-color" content="#000000">

    <meta name="apple-mobile-web-app-capable" content="yes">

    <meta name="mobile-web-app-capable" content="yes">

    <title>Zoryx</title>

    <link rel="manifest" href="manifest.json">

    <link rel="stylesheet" href="style.css">

    <script src="https://telegram.org/js/telegram-web-app.js"></script>

</head>

<body>

    <!-- Loading -->

    <div id="loading">

        <div class="loader"></div>

        <h2>Zoryx</h2>

        <p>Loading...</p>

    </div>

    <!-- App -->

    <div id="app" style="display:none;">

        <!-- Header -->

        <header id="header">

            <div class="profile">

                <img id="userPhoto" alt="Profile">

                <div>

                    <h3 id="userName">Loading...</h3>

                    <span id="userLevel">
                        Level 1
                    </span>

                </div>

            </div>

            <button id="settingButton">
                ⚙
            </button>

        </header>

        <!-- Balance -->

        <section id="balanceCard">

            <h1 id="balance">
                0
            </h1>

            <p>
                Zoryx Coin
            </p>

        </section>

        <!-- Energy -->

        <section id="energyCard">

            <div class="energyTop">

                <span>
                    Energy
                </span>

                <span id="energyText">
                    1000 / 1000
                </span>

            </div>

            <div class="energyBar">

                <div id="energyFill"></div>

            </div>

        </section>

        <!-- Coin -->

        <section id="coinArea">

            <div id="coin">

                <span>Z</span>

            </div>

        </section>

        <!-- Bottom Navigation -->

        <nav>

            <button class="nav active">
                Home
            </button>

            <button class="nav">
                Earn
            </button>

            <button class="nav">
                Friends
            </button>

            <button class="nav">
                Wallet
            </button>

            <button class="nav">
                Profile
            </button>

        </nav>

    </div>

    <script src="telegram.js"></script>

    <script src="api.js"></script>

    <script src="app.js"></script>

</body>

  </html>
