<!DOCTYPE html>
<html lang="en">

<head>

    <!-- ==========================================
         Meta
    ========================================== -->

    <meta charset="UTF-8">

    <meta
        http-equiv="X-UA-Compatible"
        content="IE=edge">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

    <meta
        name="theme-color"
        content="#0B0B0F">

    <meta
        name="apple-mobile-web-app-capable"
        content="yes">

    <meta
        name="mobile-web-app-capable"
        content="yes">

    <meta
        name="apple-mobile-web-app-status-bar-style"
        content="black-translucent">

    <meta
        name="format-detection"
        content="telephone=no">

    <title>

        Zoryx

    </title>



    <!-- ==========================================
         Manifest
    ========================================== -->

    <link
        rel="manifest"
        href="manifest.json">



    <!-- ==========================================
         Icons
    ========================================== -->

    <link
        rel="icon"
        type="image/png"
        href="assets/icon-192.png">

    <link
        rel="apple-touch-icon"
        href="assets/icon-192.png">



    <!-- ==========================================
         Telegram SDK
    ========================================== -->

    <script src="https://telegram.org/js/telegram-web-app.js"></script>



    <!-- ==========================================
         Styles
    ========================================== -->

    <link
        rel="stylesheet"
        href="style.css">

</head>

<body>



    <!-- ==========================================
         Loading Screen
    ========================================== -->

    <div

        id="loading"

        class="loading">

        <div class="loading-content">

            <img

                src="assets/logo.png"

                class="loading-logo"

                alt="Zoryx">

            <h2>

                Zoryx

            </h2>

            <p>

                Loading...

            </p>

            <div

                class="loader">

            </div>

        </div>

    </div>



    <!-- ==========================================
         Overlay
    ========================================== -->

    <div

        id="overlay"

        class="overlay">

    </div>



    <!-- ==========================================
         Popup
    ========================================== -->

    <div

        id="popup"

        class="popup">

        <div class="popup-card">

            <div class="popup-header">

                <h3

                    id="popupTitle">

                    Notification

                </h3>

                <button

                    id="popupClose"

                    class="popup-close">

                    ✕

                </button>

            </div>

            <div class="popup-body">

                <p

                    id="popupMessage">

                </p>

            </div>

        </div>

    </div>



    <!-- ==========================================
         Toast
    ========================================== -->

    <div

        id="toastContainer"

        class="toast-container">

    </div>



    <!-- ==========================================
         Main App
    ========================================== -->

    <div

        id="app"

        class="app">
