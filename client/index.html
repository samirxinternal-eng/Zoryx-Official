<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">

    <meta name="theme-color" content="#000000">

    <meta name="apple-mobile-web-app-capable" content="yes">

    <meta name="mobile-web-app-capable" content="yes">

    <meta name="apple-mobile-web-app-status-bar-style" content="black">

    <meta name="description" content="Zoryx Telegram Mini App">

    <title>Zoryx</title>

    <!-- Manifest -->

    <link rel="manifest" href="manifest.json">

    <!-- Icon -->

    <link rel="icon" href="icon-192.png">

    <!-- CSS -->

    <link rel="stylesheet" href="style.css">

    <!-- Telegram WebApp -->

    <script src="https://telegram.org/js/telegram-web-app.js" defer></script>

</head>

<body>

    <!-- ==========================
         Loading Screen
    =========================== -->

    <div id="loading">

        <div class="loader"></div>

        <h2>Zoryx</h2>

        <p>Loading...</p>

    </div>

    <!-- ==========================
         Main App
    =========================== -->

    <div id="app" style="display:none;">

        <!-- Header -->

        <header id="header">

            <div class="profile">

                <img
                    id="userPhoto"
                    src="icon-192.png"
                    alt="Profile">

                <div>

                    <h3 id="userName">
                        Loading...
                    </h3>

                    <span id="userLevel">
                        Level 1
                    </span>

                </div>

            </div>

            <button id="settingButton">
                ⚙️
            </button>

        </header>

        <!-- Balance -->

        <section id="balanceCard">

            <h1 id="balance">
                0
            </h1>

            <p>
                Zoryx Coin
            </p>

        </section>

        <!-- Energy -->

        <section id="energyCard">

            <div class="energyTop">

                <span>
                    Energy
                </span>

                <span id="energyText">
                    1000 / 1000
                </span>

            </div>

            <div class="energyBar">

                <div id="energyFill"></div>

            </div>

        </section>

        <!-- Coin -->

        <section id="coinArea">

            <div id="coin">

                <span>
                    Z
                </span>

            </div>

        </section>

        <!-- Bottom Navigation -->

        <nav id="bottomNav">

            <button class="nav active" id="navHome">
                Home
            </button>

            <button class="nav" id="navEarn">
                Earn
            </button>

            <button class="nav" id="navFriends">
                Friends
            </button>

            <button class="nav" id="navWallet">
                Wallet
            </button>

            <button class="nav" id="navProfile">
                Profile
            </button>

        </nav>

    </div>

    <!-- Scripts -->

    <script src="telegram.js" defer></script>

    <script src="api.js" defer></script>

    <script src="app.js" defer></script>

</body>

                </html>
